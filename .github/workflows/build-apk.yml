name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Lock to landscape
        run: sed -i 's/android:launchMode="singleTask"/android:launchMode="singleTask" android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml
      - name: Piano icon and splash
        run: |
          sudo apt-get install -y imagemagick > /dev/null
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert docs/icon-512.png -resize ${s}x${s} $R/mipmap-$d/$n.png
            done
          done
          convert -size 2732x2732 xc:'#0f1114' docs/icon-512.png -gravity center -composite /tmp/splash.png
          find $R -name 'splash.png' -exec cp /tmp/splash.png {} \;
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: psr-studio-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
