<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1114">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PSR Studio Keyboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0f1114;--panel:#1d2025;--panel2:#272b32;--line:#33383f;--txt:#dfe5ec;--dim:#8a929c;--lcd:#07131d;--lcdtx:#7fe3ff;--lcddim:#2d6075;--amber:#ffb020;--red:#ff3b3b;--grn:#3ddc84;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Barlow Condensed',sans-serif;user-select:none;-webkit-user-select:none}
.wrap{max-width:1000px;margin:0 auto;padding:12px}
.deck{background:linear-gradient(180deg,#2c3037 0,#17191d 14%,#0c0d0f 100%);border:1px solid #3a3f47;border-top:2px solid #b8924a;border-radius:14px 14px 4px 4px;padding:12px;box-shadow:0 18px 36px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07)}
.top{display:flex;gap:12px;align-items:stretch}
.lcd{flex:1;background:var(--lcd);border-radius:6px;box-shadow:inset 0 0 16px #000,0 0 0 3px #343a42;padding:8px 14px;font-family:'Share Tech Mono',monospace;color:var(--lcdtx);min-width:0}
.r1{display:flex;justify-content:space-between;align-items:baseline;font-size:clamp(20px,5vw,30px);text-shadow:0 0 8px rgba(127,227,255,.5)}
.r2{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--lcddim);margin-top:4px;flex-wrap:wrap}
.r2 b{color:var(--lcdtx);font-weight:400}
#st.rec{color:var(--red)}#st.play{color:var(--grn)}
.vol{width:120px;display:flex;flex-direction:column;justify-content:center;gap:8px;background:var(--panel2);border-radius:6px;padding:8px 12px;border:1px solid var(--line)}
.vol label{font-size:13px;font-weight:600;color:var(--dim);letter-spacing:.06em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:#12151a;border-radius:2px;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:26px;border-radius:3px;background:linear-gradient(#c9ced6,#8b919a);border:1px solid #000;box-shadow:0 2px 3px rgba(0,0,0,.6)}
.grid{display:grid;gap:7px;margin-top:10px}
.voices{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.ctl{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
.btn{position:relative;background:linear-gradient(#4a5058,#343840);border:1px solid #0c0d10;border-bottom-width:3px;border-radius:5px;color:var(--txt);font:600 15px 'Barlow Condensed',sans-serif;padding:10px 4px 8px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(2px);border-bottom-width:1px}
.btn i{display:block;width:16px;height:4px;margin:0 auto 5px;border-radius:2px;background:#15181c}
.btn.on i{background:var(--amber);box-shadow:0 0 7px var(--amber)}
#rec.on i{background:var(--red);box-shadow:0 0 7px var(--red)}
#play.on i{background:var(--grn);box-shadow:0 0 7px var(--grn)}
.bed{background:#08090a;border-radius:0 0 10px 10px;padding:10px 8px 8px;border:1px solid #2a2e34;border-top:5px solid #6b1d27}
.rail{overflow:hidden;position:relative}
#keys{position:relative;height:250px}
.wk,.bk{position:absolute;top:0;cursor:pointer;touch-action:none}
.wk{height:100%;transform-origin:50% 0;transition:transform .05s;background:linear-gradient(90deg,#e6dfcd 0,#fffdf6 7%,#f6f1e4 93%,#d6cfbb 100%);border-radius:0 0 7px 7px;box-shadow:inset 0 -16px 12px -10px rgba(110,95,60,.4),0 5px 3px rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px}
.wk i{font:600 11px 'Barlow Condensed';color:#8b8269;font-style:normal;pointer-events:none}.wk i:not(.c){display:none}.lbl .wk i{display:block}
.bk{height:63%;z-index:2;transform-origin:50% 0;transition:transform .05s;background:linear-gradient(90deg,#17191c,#42474f 28%,#1a1c20 72%,#08090a);border-radius:0 0 5px 5px;box-shadow:0 7px 6px rgba(0,0,0,.8),inset 0 -12px 8px rgba(255,255,255,.06)}
.wk.a{transform:translateY(3px);background:linear-gradient(90deg,#d9cfb2 0,#f1e8cd 8%,#e8dcba 92%,#c9bd9a 100%);box-shadow:inset 0 -6px 14px rgba(201,162,90,.65),0 1px 1px rgba(0,0,0,.6)}
.bk.a{transform:translateY(3px);background:linear-gradient(90deg,#101113,#2d3137 28%,#131518 72%,#050506);box-shadow:0 2px 3px rgba(0,0,0,.8),inset 0 -8px 10px rgba(201,162,90,.35)}
#sc{margin-top:10px}
.note{font-size:12px;color:var(--dim);text-align:center;margin:10px 4px 0;line-height:1.4}
.deck,.bed{transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s}
.boot .deck{opacity:0;transform:translateY(-26px)}.boot .bed{opacity:0;transform:translateY(34px)}
#intro{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#1a1d22,#060708 70%);transition:opacity .8s,visibility 0s .8s}
#intro.go{opacity:0;visibility:hidden}
#intro h1{margin:0;font:600 clamp(34px,9vw,68px) 'Barlow Condensed',sans-serif;color:#ead9b0;opacity:0;animation:lg 1.3s .2s forwards}
@keyframes lg{from{opacity:0;letter-spacing:.9em;filter:blur(8px)}to{opacity:1;letter-spacing:.32em;filter:none}}
#intro .ln{height:2px;width:0;margin:12px 0 10px;background:linear-gradient(90deg,transparent,#c9a25a,transparent);animation:lw 1.1s .9s forwards}
@keyframes lw{to{width:min(60vw,380px)}}
#intro p{margin:0;font:13px 'Share Tech Mono',monospace;letter-spacing:.3em;color:#7fe3ff;opacity:0;animation:fi 1s 1.2s forwards}
@keyframes fi{to{opacity:.85}}
#intro .bar{width:min(50vw,240px);height:3px;margin-top:22px;background:#1d2024;border-radius:2px;overflow:hidden}
#intro .bar b{display:block;height:100%;width:0;background:#7fe3ff;animation:ld 2.1s .4s forwards}
@keyframes ld{to{width:100%}}
#menu{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72)}#menu.on{display:flex}
#menu .sheet{width:min(92vw,580px);max-height:92vh;overflow:auto;background:#15171b;border:1px solid #3a3f47;border-top:2px solid #b8924a;border-radius:10px;padding:12px}
.mg{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media(prefers-reduced-motion:reduce){#intro{display:none}.deck,.bed{transition:none}.boot .deck,.boot .bed{opacity:1;transform:none}}
@media(max-width:560px){.vol{width:92px}#keys{height:230px}}
@media (orientation:landscape) and (max-height:520px){
.wrap{padding:6px 8px}
.deck{padding:6px;border-radius:10px 10px 0 0}
.vol{width:110px;padding:4px 10px}.vol label{font-size:11px}
.lcd{padding:4px 10px}.r1{font-size:20px}.r2{margin-top:0;font-size:11px}
.grid{gap:4px;margin-top:5px}
.voices{grid-template-columns:repeat(9,1fr)}.ctl{grid-template-columns:repeat(10,1fr)}
.btn{padding:5px 2px 4px;font-size:12px;border-bottom-width:2px}
.btn i{height:3px;margin-bottom:3px}
#keys{height:calc(100vh - 170px);height:calc(100dvh - 170px);min-height:100px}
.bed{padding:6px 6px 4px}#sc{margin-top:6px}.note{display:none}
}
</style>
</head>
<body class="boot">
<div id="intro"><h1>PSR STUDIO</h1><div class="ln"></div><p>DIGITAL STAGE PIANO</p><div class="bar"><b></b></div></div>
<div class="wrap">
 <div class="deck">
  <div class="top">
   <div class="lcd">
    <div class="r1"><span id="vn"></span><span id="st">READY</span></div>
    <div class="r2"><span id="l2"></span><span>NOTE <b id="ln">--</b></span><span>TEMPO <b id="bpm">100</b></span></div>
   </div>
   <div class="vol"><label for="vol">MASTER</label><input type="range" id="vol" min="0" max="1" step=".01" value=".75"></div>
  </div>
  <div class="grid voices" id="vb"></div>
  <div class="grid ctl">
   <button class="btn" id="rec"><i></i>REC</button>
   <button class="btn" id="play"><i></i>PLAY</button>
   <button class="btn" id="stop"><i></i>STOP</button>
   <button class="btn" id="met"><i></i>METRONOME</button>
   <button class="btn" id="bm"><i></i>TEMPO −</button>
   <button class="btn" id="bp"><i></i>TEMPO +</button>
   <button class="btn" id="sus"><i></i>SUSTAIN</button>
   <button class="btn" id="od"><i></i>OCTAVE −</button>
   <button class="btn" id="ou"><i></i>OCTAVE +</button>
   <button class="btn" id="mn"><i></i>MENU</button>
  </div>
 </div>
 <div class="bed">
  <div class="rail" id="rail"><div id="keys"></div></div>
  <input type="range" id="sc" min="0" max="100" value="0" aria-label="Scroll keys">
 </div>
 <div class="note">Computer keys: A S D F G H J K and W E T Y U play notes · Z / X change octave · Space = sustain</div>
</div>
<div id="menu"><div class="sheet"><div class="grid mg">
<button class="btn" id="m_rv"></button><button class="btn" id="m_ly"></button><button class="btn" id="m_tc"></button><button class="btn" id="m_lb"></button><button class="btn" id="m_sz"></button>
<button class="btn" id="m_sv"><i></i>SAVE TAKE</button><button class="btn" id="m_ns"></button><button class="btn" id="m_ds"><i></i>DELETE SONG</button><button class="btn" id="m_ex"><i></i>EXPORT MIDI</button><button class="btn" id="m_x"><i></i>CLOSE</button>
</div></div></div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
let ac,master,nb,wetG,rv=1,lyr='',touch=0,ks=1;const WET=[0,.18,.4],RVN=['OFF','ROOM','HALL'];function mkIR(){const n=ac.sampleRate*2.2|0,b=ac.createBuffer(2,n,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}return b;}
function init(){
 if(!ac){
  ac=new(window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=+$('vol').value;
  const c=ac.createDynamicsCompressor();c.threshold.value=-10;c.knee.value=12;c.ratio.value=3;c.attack.value=.003;c.release.value=.2;const cv=ac.createConvolver();cv.buffer=mkIR();wetG=ac.createGain();wetG.gain.value=WET[rv];master.connect(c);master.connect(cv);cv.connect(wetG).connect(c);c.connect(ac.destination);
  nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
  const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 }
 if(ac.state!=='running')ac.resume();
}
const hz=m=>440*Math.pow(2,(m-69)/12);
function build(f,o,vl){vl=vl||1;
 const t=ac.currentTime,out=ac.createGain();out.gain.value=0;out.connect(master);
 let dest=out;
 if(o.f){const b=ac.createBiquadFilter();b.type='lowpass';b.Q.value=o.f[3]||.5;b.frequency.setValueAtTime(o.f[0],t);b.frequency.exponentialRampToValueAtTime(o.f[1],t+o.f[2]);b.connect(out);dest=b;}
 const os=o.p.map(([m,a,ty,dt])=>{const x=ac.createOscillator(),g=ac.createGain();x.type=ty;x.frequency.value=f*m;if(dt)x.detune.value=dt;g.gain.value=a;x.connect(g).connect(dest);x.start(t);return x;});
 const g=out.gain;g.setValueAtTime(0,t);g.linearRampToValueAtTime(o.pk*vl,t+o.a);
 if(o.sus){g.exponentialRampToValueAtTime(o.sus*vl,t+o.a+o.d);}
 if(o.end){g.exponentialRampToValueAtTime(.0008,t+o.end);}
 return{stop(){const n=ac.currentTime;g.cancelScheduledValues(n);g.setValueAtTime(g.value,n);g.linearRampToValueAtTime(0,n+o.rel);os.forEach(x=>x.stop(n+o.rel+.03));}};
}
function noise(type,fq,dur,vol){
 const t=ac.currentTime,s=ac.createBufferSource(),b=ac.createBiquadFilter(),g=ac.createGain();
 s.buffer=nb;b.type=type;b.frequency.value=fq;
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 s.connect(b).connect(g).connect(master);s.start(t);s.stop(t+dur+.02);
}
function thump(f0,f1,dur,vol){
 const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
 o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 o.connect(g).connect(master);o.start(t);o.stop(t+dur+.02);
}
const DRUMS=['Kick','Snare','Hi-hat','Open hat','Tom','Crash'];
function drum(m){
 const k=m%6;
 if(k===0)thump(160,45,.3,1);
 else if(k===1){noise('bandpass',1800,.2,.8);thump(220,120,.12,.5);}
 else if(k===2)noise('highpass',7000,.05,.5);
 else if(k===3)noise('highpass',7000,.4,.45);
 else if(k===4)thump(220,80,.35,.9);
 else noise('highpass',3500,1,.45);
 return{stop(){}};
}
const V={
 piano:{n:'GRAND PIANO',o:{p:[[1,.6,'triangle'],[2,.3,'sine'],[3,.14,'sine'],[4,.08,'sine']],a:.006,pk:.85,sus:.28,d:.35,end:8,f:[6200,1200,2.2,.4],rel:.35}},
 epiano:{n:'E.PIANO',o:{p:[[1,.6,'sine'],[2,.2,'sine'],[4,.08,'sine']],a:.01,pk:.7,sus:.22,d:.6,end:3.5,f:[5000,1500,1],rel:.25}},
 organ:{n:'PIPE ORGAN',o:{p:[[1,.5,'sine'],[2,.35,'sine'],[3,.18,'sine'],[4,.14,'sine'],[6,.08,'sine']],a:.03,pk:.5,rel:.12}},
 strings:{n:'STRINGS',o:{p:[[1,.4,'sawtooth',-8],[1,.4,'sawtooth',8],[2,.12,'sawtooth']],a:.35,pk:.4,f:[1800,2400,.5,.7],rel:.5}},
 guitar:{n:'GUITAR',o:{p:[[1,.5,'sawtooth'],[2,.2,'triangle']],a:.003,pk:.8,sus:.25,d:.2,end:2.5,f:[4200,500,.6,1],rel:.15}},
 synth:{n:'SYNTH LEAD',o:{p:[[1,.4,'sawtooth',-6],[1,.4,'sawtooth',6],[.5,.18,'square']],a:.05,pk:.5,sus:.25,d:1.4,f:[500,3000,.15,4],rel:.4}},
 bells:{n:'BELLS',o:{p:[[1,.5,'sine'],[2.01,.3,'sine'],[3.4,.18,'sine'],[5.2,.1,'sine']],a:.004,pk:.7,end:3,rel:.5}},
 bass:{n:'SYNTH BASS',o:{p:[[.5,.6,'sawtooth'],[.25,.4,'sine']],a:.01,pk:.8,sus:.5,d:.3,f:[900,200,.3,2],rel:.15}},
 drums:{n:'DRUM KIT',drum:1}
};
let voice='piano',oct=3,sustain=false,down=false;
const act=new Map();
let recording=false,playing=false,take=[],t0=0,timers=[];
const nm=m=>['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][m%12]+(Math.floor(m/12)-1);
function lcd(){
 $('vn').textContent=V[voice].n;
 $('l2').textContent='OCT '+oct+'  C'+oct+'-C'+(oct+1);
 $('bpm').textContent=bpm;
 const s=$('st');
 s.textContent=recording?'● REC':playing?'▶ PLAY':'READY';
 s.className=recording?'rec':playing?'play':'';
}
function on(m,v,pb,vl){
 init();const ex=act.get(m);if(ex){if(ex.hd)return;ex.h.stop();act.delete(m);}
 if(act.size>=24){const k0=act.keys().next().value;act.get(k0).h.stop();act.delete(k0);paint(k0,0);}
 v=v||voice;
 const mk=id=>V[id].drum?drum(m):build(hz(m),V[id].o,vl);const h1=mk(v),h2=lyr&&lyr!==v?mk(lyr):null;const h={stop(){h1.stop();if(h2)h2.stop();}};
 act.set(m,{h,s:false,pb,hd:1});
 paint(m,1);
 $('ln').textContent=V[v].drum?DRUMS[m%6]:nm(m);
 if(recording&&!pb)take.push({t:performance.now()-t0,e:1,m,v,vl});
}
function off(m,pb){
 const n=act.get(m);if(!n)return;
 if(recording&&!pb)take.push({t:performance.now()-t0,e:0,m});
 n.hd=0;if(sustain&&!pb){n.s=true;paint(m,0);return;}
 n.h.stop();act.delete(m);paint(m,0);
}
function setSus(x){
 sustain=x;$('sus').classList.toggle('on',x);
 if(!x)act.forEach((n,m)=>{if(n.s){n.h.stop();act.delete(m);}});
}
function stopPb(){
 timers.forEach(clearTimeout);timers=[];
 act.forEach((n,m)=>{if(n.pb){n.h.stop();act.delete(m);paint(m,0);}});
 playing=false;$('play').classList.remove('on');lcd();
}
$('rec').onclick=()=>{
 init();
 if(recording){recording=false;$('rec').classList.remove('on');lcd();return;}
 stopPb();take=[];t0=performance.now();recording=true;$('rec').classList.add('on');lcd();
};
$('play').onclick=()=>{
 init();
 if(playing){stopPb();return;}
 if(recording){recording=false;$('rec').classList.remove('on');}
 if(!take.length){$('st').textContent='NO TAKE';return;}
 const s=take[0].t;playing=true;$('play').classList.add('on');lcd();
 take.forEach(x=>timers.push(setTimeout(()=>x.e?on(x.m,x.v,1,x.vl):off(x.m,1),x.t-s)));
 timers.push(setTimeout(stopPb,take[take.length-1].t-s+400));
};
$('stop').onclick=()=>{
 recording=false;$('rec').classList.remove('on');stopPb();
 act.forEach((n,m)=>{n.h.stop();paint(m,0);});act.clear();
};
let bpm=100,met=null,beat=0;
function tick(){
 const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
 o.type='square';o.frequency.value=beat%4?900:1500;
 g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
 o.connect(g).connect(master);o.start(t);o.stop(t+.06);beat++;
}
function startMet(){clearInterval(met);beat=0;tick();met=setInterval(tick,60000/bpm);}
$('met').onclick=()=>{
 init();
 if(met){clearInterval(met);met=null;$('met').classList.remove('on');}
 else{startMet();$('met').classList.add('on');}
};
function setBpm(d){bpm=Math.max(40,Math.min(240,bpm+d));lcd();if(met)startMet();}
$('bm').onclick=()=>setBpm(-5);$('bp').onclick=()=>setBpm(5);
$('sus').onclick=()=>setSus(!sustain);
let W=46,BW=28;const calcW=()=>{W=Math.max(40,Math.min(110,Math.round(ks*innerWidth/(innerWidth>innerHeight?12:7))));BW=Math.round(W*.62);};calcW();
const WI={0:0,2:1,4:2,5:3,7:4,9:5,11:6},BC={1:.94,3:2.06,6:3.9,8:5,10:6.1};
const kel={},keys=$('keys');
keys.style.width=36*W+'px';
const lay=()=>{keys.style.width=36*W+'px';for(const m in kel){const e=kel[m],o=Math.floor((m-36)/12),n=m%12;if(n in WI){e.style.left=(o*7+WI[n])*W+'px';e.style.width=W-1+'px';}else{e.style.left=(o*7+BC[n])*W-BW/2+'px';e.style.width=BW+'px';}}fit();};
for(let m=36;m<=96;m++){
 const o=Math.floor((m-36)/12),n=m%12,e=document.createElement('div');
 if(n in WI){
  e.className='wk';e.style.left=(o*7+WI[n])*W+'px';e.style.width=W-1+'px';
  e.innerHTML='<i'+(n===0?' class="c"':'')+'>'+nm(m)+'</i>';
 }else{
  e.className='bk';e.style.left=(o*7+BC[n])*W-BW/2+'px';e.style.width=BW+'px';
 }
 e.onpointerdown=ev=>{ev.preventDefault();if(e.releasePointerCapture)try{e.releasePointerCapture(ev.pointerId)}catch(x){}const r=e.getBoundingClientRect(),vl=touch?Math.max(.3,Math.min(1,(ev.clientY-r.top)/r.height*1.15)):1;down=true;on(m,0,0,vl);};
 e.onpointerenter=()=>{if(down)on(m);};
 e.onpointerup=e.onpointerleave=e.onpointercancel=()=>off(m);
 keys.appendChild(e);kel[m]=e;
}
function paint(m,x){if(kel[m])kel[m].classList.toggle('a',!!x);}
addEventListener('pointerup',()=>{down=false;});
const rail=$('rail'),sc=$('sc');
function fit(){sc.max=Math.max(0,keys.scrollWidth-rail.clientWidth);}
function go(m){fit();rail.scrollLeft=Math.max(0,kel[m].offsetLeft-20);sc.value=rail.scrollLeft;}
sc.oninput=()=>{rail.scrollLeft=+sc.value;};
addEventListener('resize',()=>{calcW();lay();});
function setOct(d){oct=Math.max(2,Math.min(6,oct+d));lcd();go(12*(oct+1));}
$('od').onclick=()=>setOct(-1);$('ou').onclick=()=>setOct(1);
const KM={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15,';':16};
const held=new Set();
addEventListener('keydown',e=>{
 if(e.repeat||e.ctrlKey||e.metaKey)return;
 const k=e.key.toLowerCase();
 if(k===' '){e.preventDefault();setSus(true);}
 else if(k==='z')setOct(-1);else if(k==='x')setOct(1);
 else if(k in KM&&!held.has(k)){held.add(k);on(12*(oct+1)+KM[k]);}
});
addEventListener('keyup',e=>{
 const k=e.key.toLowerCase();
 if(k===' ')setSus(false);
 else if(k in KM){held.delete(k);off(12*(oct+1)+KM[k]);}
});
const vb=$('vb');
Object.keys(V).forEach(id=>{
 const b=document.createElement('button');
 b.className='btn'+(id===voice?' on':'');b.innerHTML='<i></i>'+V[id].n;
 b.onclick=()=>{voice=id;[...vb.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');lcd();};
 vb.appendChild(b);
});
$('vol').oninput=e=>{if(master)master.gain.value=+e.target.value;};
lcd();
setTimeout(()=>go(48),50);
const SZ=[.8,1,1.25];let songs=[],si=0;try{songs=JSON.parse(localStorage.getItem('psr_songs')||'[]')}catch(e){}
const keep=()=>{try{localStorage.setItem('psr_songs',JSON.stringify(songs))}catch(e){}};
const mt=()=>{const b=document.body.classList.contains('lbl');
$('m_rv').innerHTML='<i></i>REVERB: '+RVN[rv];$('m_ly').innerHTML='<i></i>LAYER: '+(lyr?V[lyr].n:'OFF');$('m_tc').innerHTML='<i></i>TOUCH: '+(touch?'ON':'OFF');$('m_lb').innerHTML='<i></i>LABELS: '+(b?'ON':'OFF');$('m_sz').innerHTML='<i></i>KEY SIZE: '+['S','M','L'][SZ.indexOf(ks)];$('m_ns').innerHTML='<i></i>SONG: '+(songs.length?(si+1)+'/'+songs.length:'NONE');
$('m_rv').classList.toggle('on',rv>0);$('m_ly').classList.toggle('on',!!lyr);$('m_tc').classList.toggle('on',!!touch);$('m_lb').classList.toggle('on',b);};
$('mn').onclick=()=>{mt();$('menu').classList.add('on');};
$('m_x').onclick=()=>$('menu').classList.remove('on');
$('m_rv').onclick=()=>{rv=(rv+1)%3;if(wetG)wetG.gain.value=WET[rv];mt();};
$('m_ly').onclick=()=>{const o=['',...Object.keys(V).filter(k=>k!=='drums')];lyr=o[(o.indexOf(lyr)+1)%o.length];mt();};
$('m_tc').onclick=()=>{touch=touch?0:1;mt();};
$('m_lb').onclick=()=>{document.body.classList.toggle('lbl');mt();};
$('m_sz').onclick=()=>{ks=SZ[(SZ.indexOf(ks)+1)%3];calcW();lay();mt();};
$('m_sv').onclick=()=>{if(!take.length){$('ln').textContent='NO TAKE';return;}songs.push({name:'TAKE '+(songs.length+1),take});si=songs.length-1;keep();$('ln').textContent='SAVED';mt();};
$('m_ns').onclick=()=>{if(!songs.length)return;si=(si+1)%songs.length;take=songs[si].take;$('ln').textContent=songs[si].name;mt();};
$('m_ds').onclick=()=>{if(!songs.length)return;songs.splice(si,1);si=0;keep();mt();};
const vlq=n=>{const b=[n&127];while(n>>=7)b.unshift((n&127)|128);return b;};
$('m_ex').onclick=async()=>{
 if(!take.length){$('ln').textContent='NO TAKE';return;}
 const ppq=480,s=take[0].t,tp=Math.round(60000000/bpm),tr=[0,255,81,3,tp>>16&255,tp>>8&255,tp&255];let last=0;
 take.forEach(x=>{const k=Math.round((x.t-s)*ppq*bpm/60000);tr.push(...vlq(k-last),x.e?144:128,x.m&127,x.e?Math.min(127,Math.round(40+87*(x.vl||1))):0);last=k;});
 tr.push(0,255,47,0);const L=tr.length;
 const f=new File([new Uint8Array([77,84,104,100,0,0,0,6,0,0,0,1,ppq>>8,ppq&255,77,84,114,107,L>>24&255,L>>16&255,L>>8&255,L&255,...tr])],'psr-take.mid',{type:'audio/midi'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download='psr-take.mid';a.click();
};
if(navigator.requestMIDIAccess)navigator.requestMIDIAccess().then(a=>{const hk=i=>{i.onmidimessage=e=>{const[s,n,v]=e.data,c=s&240;if(c===144&&v>0)on(n,0,0,v/127);else if(c===128||c===144)off(n);else if(c===176&&n===64)setSus(v>=64);};};a.inputs.forEach(hk);a.onstatechange=()=>a.inputs.forEach(hk);}).catch(()=>{});
function sweep(){const ms=Object.keys(kel).map(Number).sort((a,b)=>a-b);ms.forEach((m,i)=>{setTimeout(()=>{if(!act.has(m))paint(m,1)},i*16);setTimeout(()=>{if(!act.has(m))paint(m,0)},i*16+170);});}
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
setTimeout(()=>{$('intro').classList.add('go');document.body.classList.remove('boot');setTimeout(sweep,450);},rm?0:2700);
addEventListener('visibilitychange',()=>{if(ac&&document.visibilityState==='visible')ac.resume();});
})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
