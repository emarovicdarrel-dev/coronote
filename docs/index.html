<style>
:root{color-scheme:light;--bg:#eef2f9;--ink:#1b2536;--dim:#6b7890;--acc:#2f6bff;--acc2:#e6eeff;--red:#e5384f;--grn:#1fa971;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;user-select:none;-webkit-user-select:none;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 10px;background:var(--t1);box-shadow:0 2px 12px rgba(30,50,90,.14);position:relative;z-index:5}
.grp{display:flex;align-items:center;gap:3px;background:var(--acc2);border-radius:11px;padding:3px}
.grp b{min-width:30px;text-align:center;font-size:13px}
.grp span{min-width:44px;text-align:center;font:700 12px 'Manrope'}
.btn{min-width:34px;height:34px;padding:0 10px;border:0;border-radius:9px;background:var(--b1);color:var(--ink);font:700 13px 'Manrope',sans-serif;cursor:pointer;box-shadow:0 1px 0 var(--ln);touch-action:manipulation}
.btn:active{transform:scale(.95)}
.btn.on{background:var(--acc);color:#fff;box-shadow:none}
#rec.on{background:var(--red)}#play.on{background:var(--grn)}
.btn i{display:none}
.snd{background:var(--acc);color:#fff;min-width:124px;text-align:left}
.pill{font:700 11px 'Manrope';color:var(--dim);background:var(--b2);border-radius:20px;padding:6px 10px}
#st.rec{color:var(--red)}#st.play{color:var(--grn)}
#vol{flex:1}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--ln);border-radius:2px;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 1px 4px rgba(30,50,90,.4)}
#minirow{display:flex;flex:1 1 150px;min-width:130px;gap:6px;align-items:center}#mini{position:relative;flex:1;height:30px;background:var(--b1);border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--ln);touch-action:none}
#minirow .btn{min-width:38px;height:30px;font-size:16px;padding:0}
.pedal{flex:0 0 76px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font:700 12px 'Manrope';letter-spacing:.35em;color:var(--dim2);background:linear-gradient(90deg,var(--pd1),var(--pd2));border-radius:10px;box-shadow:0 3px 0 var(--pd3),0 6px 8px rgba(30,50,90,.25);touch-action:none;cursor:pointer}
.pedal.on{background:linear-gradient(90deg,var(--p1),var(--p2));color:#fff;box-shadow:0 1px 0 var(--p2);transform:translateY(2px)}
.mw{position:absolute;top:0;bottom:0;border-right:1px solid var(--ln);background:#f6f7fb}
.mb{position:absolute;top:0;height:62%;background:#2a2f3a;border-radius:0 0 2px 2px}
#win{position:absolute;top:0;bottom:0;border:2px solid var(--acc);background:rgba(var(--accrgb),.16);border-radius:5px;pointer-events:none}
.stage{flex:1;min-height:0;display:flex;flex-direction:row;gap:8px;margin:8px 10px 10px;padding:8px 8px 6px;background:linear-gradient(var(--fr1),var(--fr2));border-radius:10px;border-top:4px solid var(--felt)}
.rail{flex:1;min-height:0;overflow:hidden;position:relative}
#keys{position:relative;height:100%}
#sc{display:none}
.wk,.bk{position:absolute;top:0;cursor:pointer;touch-action:none;transform-origin:50% 0;transition:transform .05s}
.wk{height:100%;background:linear-gradient(180deg,#fff 0,#fbfcfe 72%,#e4e9f2 100%);border-radius:0 0 9px 9px;box-shadow:inset 0 -12px 10px -8px rgba(40,60,100,.28),0 3px 0 #c6cfdd,0 7px 8px rgba(30,50,90,.22);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px}
.wk i{font:700 11px 'Manrope';color:#8a97ad;font-style:normal;pointer-events:none}
.wk i:not(.c){display:none}.lbl .wk i{display:block}
.bk{height:62%;z-index:2;background:linear-gradient(90deg,#222733,#3b4252 30%,#161a23 75%,#0b0d12);border-radius:0 0 7px 7px;box-shadow:0 7px 8px rgba(20,30,50,.5),inset 0 -10px 8px rgba(255,255,255,.08)}
.wk.a{transform:translateY(3px);background:linear-gradient(var(--k1),var(--k2));box-shadow:0 1px 0 var(--k3)}
.bk.a{transform:translateY(3px);background:linear-gradient(var(--p1),var(--p2));box-shadow:0 2px 3px rgba(20,30,50,.5)}
.wk.h:not(.a){background:linear-gradient(#ffe9b0,#ffc94d)}.bk.h:not(.a){background:linear-gradient(#ffb020,#c98300)}
#fall{display:none;position:relative;overflow:hidden;flex:1;min-height:0;background:linear-gradient(var(--f1),var(--f2));border-radius:6px 6px 0 0}
#fall::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffb020}
.learn .rail{display:flex;flex-direction:column}.learn #fall{display:block}.learn #keys{height:44%;flex:none}
.nb{position:absolute;top:0;border-radius:6px;background:var(--n1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);color:#fff;font:700 11px 'Manrope';text-align:center;padding-top:3px;overflow:hidden}
.nb.k{background:var(--nk2)}.nb.cur{background:#ffb020}
.grid{display:grid;gap:7px}
.voices{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.mg{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid .btn{height:auto;min-height:42px;padding:10px 8px;background:var(--b2)}
.grid .btn.on{background:var(--acc)}
.ov{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(20,30,50,.45)}.ov.on{display:flex}
.sheet{width:min(92vw,580px);max-height:90vh;overflow:auto;background:var(--t1);border-radius:14px;padding:12px;box-shadow:0 20px 50px rgba(20,30,50,.4)}
.note{font-size:11px;color:var(--dim);text-align:center;margin-top:10px}
.top,.stage,#mini{transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s}
.boot .top{opacity:0;transform:translateY(-100%)}.boot .stage,.boot #mini{opacity:0;transform:translateY(40px)}
#intro{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#fff,var(--bg2) 75%);transition:opacity .8s,visibility 0s .8s}
#intro.go{opacity:0;visibility:hidden}
#intro h1{margin:0;font:700 clamp(40px,10vw,76px) 'Cormorant Garamond',serif;color:#1b2536;opacity:0;animation:lg 1.3s .2s forwards}
@keyframes lg{from{opacity:0;letter-spacing:.8em;filter:blur(8px)}to{opacity:1;letter-spacing:.26em;filter:none}}
#intro .ln{height:2px;width:0;margin:10px 0 12px;background:linear-gradient(90deg,transparent,var(--acc),transparent);animation:lw 1.1s .9s forwards}
@keyframes lw{to{width:min(60vw,380px)}}
#intro p{margin:0;font:700 12px 'Manrope';letter-spacing:.45em;color:var(--acc);opacity:0;animation:fi 1s 1.2s forwards}
@keyframes fi{to{opacity:1}}
#intro svg{width:96px;height:96px;margin-bottom:14px;opacity:0;animation:fi .9s .1s forwards}
#intro .bar{width:min(50vw,240px);height:3px;margin-top:22px;background:var(--ln);border-radius:2px;overflow:hidden}
#intro .bar b{display:block;height:100%;width:0;background:var(--acc);animation:ld 2.1s .4s forwards}
@keyframes ld{to{width:100%}}
@media(prefers-reduced-motion:reduce){#intro{display:none}.top,.stage,#mini{transition:none}.boot .top,.boot .stage,.boot #mini{opacity:1;transform:none}}
#hud{display:flex;flex-direction:column;gap:2px}#hud .pill{padding:2px 8px;font-size:10px;text-align:center;min-width:64px}
.mrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font:700 12px 'Manrope',sans-serif;color:var(--dim)}.mrow input{flex:1}
html,body{background:radial-gradient(1100px 480px at 15% -10%,var(--glow,#fff) 0,transparent 60%),radial-gradient(900px 480px at 100% 0,var(--bgA) 0,transparent 55%),linear-gradient(var(--bg1),var(--bg2))}
.logo{width:32px;height:32px;flex:none;border-radius:9px;box-shadow:0 2px 6px rgba(30,50,90,.28)}

.btn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 #fff,0 1px 0 var(--bs)}

.pill{box-shadow:inset 0 1px 2px rgba(30,50,90,.1)}

.stage{background:linear-gradient(180deg,var(--fr1),var(--fr2));border:1px solid var(--fr3);border-top:5px solid var(--felt);box-shadow:0 14px 34px rgba(30,50,90,.2),inset 0 1px 0 rgba(255,255,255,.65)}

.bk{background:linear-gradient(90deg,#1b1f29,#454c5e 32%,#171b25 78%,#090b10)}
.bk::after{content:'';position:absolute;left:14%;right:14%;top:0;height:52%;border-radius:0 0 45% 45%;background:linear-gradient(rgba(255,255,255,.2),transparent);pointer-events:none}
#fall{background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--w,46px) - 1px),rgba(30,50,90,.08) calc(var(--w,46px) - 1px),rgba(30,50,90,.08) var(--w,46px)),linear-gradient(var(--f1),var(--f2))}
.nb{background:linear-gradient(var(--n1),var(--n2));box-shadow:inset 0 0 0 2px rgba(255,255,255,.65),0 4px 10px rgba(var(--accrgb),.35)}
.nb.k{background:linear-gradient(var(--nk1),var(--nk2))}
.nb.cur{background:linear-gradient(#ffd066,#ff9d1a);box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 0 16px rgba(255,176,32,.7)}
.ov{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{border-radius:18px;background:linear-gradient(var(--t1),var(--t2));box-shadow:0 30px 70px rgba(20,30,50,.45)}
#intro svg{width:92px;height:53px;margin-bottom:6px;opacity:0;animation:cr .9s .1s forwards}
@keyframes cr{from{opacity:0;transform:translateY(-16px) scale(.92)}to{opacity:1;transform:none}}
#intro h1{font:700 clamp(44px,10vw,80px) 'Cormorant Garamond',serif;letter-spacing:.1em;padding-left:.1em;line-height:1;animation:wm 1.2s .35s forwards}
@keyframes wm{from{opacity:0;letter-spacing:.3em;filter:blur(6px)}to{opacity:1;letter-spacing:.1em;filter:none}}
#intro .ln{height:2px;background:linear-gradient(90deg,transparent,#c9962f,transparent);position:relative;overflow:visible;margin:14px 0 12px}
#intro .ln::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;background:#d4a53c;transform:translate(-50%,-50%) rotate(45deg)}
#intro p{color:#9a6c17}
#intro .bar b{background:linear-gradient(90deg,#e6c670,#c9962f)}
.brand{display:flex;flex-direction:column;align-items:center;gap:1px;flex:none;line-height:1;margin-right:2px}
.brand svg{width:28px;height:16px}
.brand b{font:700 16px 'Cormorant Garamond',serif;color:var(--ink);letter-spacing:.14em;margin-right:-.14em}
@media(max-width:760px){.brand{display:none}}
.tabs{display:flex;gap:6px;margin:0 0 10px}.tab{flex:1;border:0;border-radius:10px;padding:10px;font:700 12px 'Manrope',sans-serif;background:var(--tabbg);color:var(--dim2);cursor:pointer}.tab.on{background:linear-gradient(var(--a1),var(--a2));color:#fff;box-shadow:0 3px 8px rgba(var(--accrgb),.3)}
.mg .btn{display:none}.mg[data-show=s] .btn[data-t=s],.mg[data-show=p] .btn[data-t=p],.mg[data-show=g] .btn[data-t=g],.mg[data-show=l] .btn[data-t=l],.mg .btn[data-t="*"]{display:block}

updTh();saveCfg();$('m_two').innerHTML='<i></i>TWO ROWS: '+(document.body.classList.contains('two')?'ON':'OFF');$('m_two').classList.toggle('on',document.body.classList.contains('two'));$('m_r2').innerHTML='<i></i>ROW 2: '+R2+' OCTAVE'+(R2>1?'S':'')+' LOWER';$('m_sp').innerHTML='<i></i>SPLIT (LEFT HAND): '+(spl?V[spl].n:'OFF');$('m_sp').classList.toggle('on',!!spl);$('m_ts').innerHTML='<i></i>TIME SIG: '+ts+'/'+(ts===6?8:4);$('m_ci').innerHTML='<i></i>COUNT-IN: '+(ci?'ON':'OFF');$('m_ci').classList.toggle('on',!!ci);$('m_tn').innerHTML='<i></i>TONE: '+TN[tn].n;$('m_tr').innerHTML='<i></i>TRANSPOSE: '+(tr>0?'+':'')+tr;$('m_tr').classList.toggle('on',tr!==0);$('m_rh').innerHTML='<i></i>RHYTHM: '+RH[rhP].n;$('m_rh').classList.toggle('on',rhP>0);$('m_ln').innerHTML='<i></i>LEARN: '+(L.run?SONGS[L.si].n:'OFF');$('m_ln').classList.toggle('on',!!L.run);$('m_rv').classList.toggle('on',rv>0);$('m_ly').classList.toggle('on',!!lyr);$('m_tc').classList.toggle('on',!!touch);$('m_lb').classList.toggle('on',b);};
$('mn').onclick=()=>{mt();$('menu').classList.add('on');};
$('m_x').onclick=()=>$('menu').classList.remove('on');
$('m_rv').onclick=()=>{rv=(rv+1)%3;if(wetG)wetG.gain.value=WET[rv];if(cvN){try{if(rv>0)master.connect(cvN);else master.disconnect(cvN);}catch(e){}}mt();};
$('m_ly').onclick=()=>{const o=['',...Object.keys(V).filter(k=>k!=='drums')];lyr=o[(o.indexOf(lyr)+1)%o.length];mt();};
$('m_tc').onclick=()=>{touch=touch?0:1;mt();};
$('m_lb').onclick=()=>{document.body.classList.toggle('lbl');mt();};
$('m_sz').onclick=()=>{zoom(1,1);mt();};
$('m_sv').onclick=()=>{if(!take.length){$('ln').textContent='NO TAKE';return;}songs.push({name:'TAKE '+(songs.length+1),take});si=songs.length-1;keep();$('ln').textContent='SAVED';mt();};
$('m_ns').onclick=()=>{if(!songs.length)return;si=(si+1)%songs.length;take=songs[si].take;$('ln').textContent=songs[si].name;mt();};
$('m_ds').onclick=()=>{if(!songs.length)return;songs.splice(si,1);si=0;keep();mt();};
const vlq=n=>{const b=[n&127];while(n>>=7)b.unshift((n&127)|128);return b;};
$('m_ex').onclick=async()=>{
 if(!take.length){$('ln').textContent='NO TAKE';return;}
 const ppq=480,s=take[0].t,tp=Math.round(60000000/bpm),tr=[0,255,81,3,tp>>16&255,tp>>8&255,tp&255];let last=0;
 take.forEach(x=>{const k=Math.round((x.t-s)*ppq*bpm/60000);tr.push(...vlq(k-last),...(x.e===2?[176,64,x.x?127:0]:[x.e?144:128,x.m&127,x.e?Math.min(127,Math.round(40+87*(x.vl||1))):0]));last=k;});
 tr.push(0,255,47,0);const L=tr.length;
 const f=new File([new Uint8Array([77,84,104,100,0,0,0,6,0,0,0,1,ppq>>8,ppq&255,77,84,114,107,L>>24&255,L>>16&255,L>>8&255,L&255,...tr])],'psr-take.mid',{type:'audio/midi'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download='psr-take.mid';a.click();
};
if(navigator.requestMIDIAccess)navigator.requestMIDIAccess().then(a=>{const hk=i=>{i.onmidimessage=e=>{const[s,n,v]=e.data,c=s&240;if(c===144&&v>0)on(n,0,0,v/127);else if(c===128||c===144)off(n);else if(c===176&&n===64)setSus(v>=64);};};a.inputs.forEach(hk);a.onstatechange=()=>a.inputs.forEach(hk);}).catch(()=>{});
function sweep(){const ms=Object.keys(kel).map(Number).sort((a,b)=>a-b);ms.forEach((m,i)=>{setTimeout(()=>{if(!act.has(m))paint(m,1)},i*16);setTimeout(()=>{if(!act.has(m))paint(m,0)},i*16+170);});}
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
setTimeout(()=>{$('intro').classList.add('go');document.body.classList.remove('boot');setTimeout(sweep,450);},rm?0:2700);
addEventListener('visibilitychange',()=>{if(ac&&document.visibilityState==='visible')ac.resume();});
})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
