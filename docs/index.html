<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rossum Grand Piano</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#eef2f9;--ink:#1b2536;--dim:#6b7890;--acc:#2f6bff;--acc2:#e6eeff;--red:#e5384f;--grn:#1fa971;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;user-select:none;-webkit-user-select:none;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 10px;background:#fff;box-shadow:0 2px 12px rgba(30,50,90,.14);position:relative;z-index:5}
.grp{display:flex;align-items:center;gap:3px;background:var(--acc2);border-radius:11px;padding:3px}
.grp b{min-width:30px;text-align:center;font-size:13px}
.grp span{min-width:44px;text-align:center;font:700 12px 'Manrope'}
.btn{min-width:34px;height:34px;padding:0 10px;border:0;border-radius:9px;background:#fff;color:var(--ink);font:700 13px 'Manrope',sans-serif;cursor:pointer;box-shadow:0 1px 0 #d5dcea;touch-action:manipulation}
.btn:active{transform:scale(.95)}
.btn.on{background:var(--acc);color:#fff;box-shadow:none}
#rec.on{background:var(--red)}#play.on{background:var(--grn)}
.btn i{display:none}
.snd{background:var(--acc);color:#fff;min-width:124px;text-align:left}
.pill{font:700 11px 'Manrope';color:var(--dim);background:#f1f4fa;border-radius:20px;padding:6px 10px}
#st.rec{color:var(--red)}#st.play{color:var(--grn)}
#vol{width:84px;margin-left:auto}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:#cfd8e8;border-radius:2px;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 1px 4px rgba(30,50,90,.4)}
#minirow{display:flex;gap:8px;align-items:center;margin:8px 10px 0}#mini{position:relative;flex:1;height:30px;background:#fff;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px #d5dcea;touch-action:none}
#minirow .btn{min-width:38px;height:30px;font-size:16px;padding:0}
.pedal{flex:0 0 76px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font:700 12px 'Manrope';letter-spacing:.35em;color:#51607a;background:linear-gradient(90deg,#e8eef9,#c9d4e8);border-radius:10px;box-shadow:0 3px 0 #a7b4cd,0 6px 8px rgba(30,50,90,.25);touch-action:none;cursor:pointer}
.pedal.on{background:linear-gradient(90deg,#3a72ff,#1d44b3);color:#fff;box-shadow:0 1px 0 #1d44b3;transform:translateY(2px)}
.mw{position:absolute;top:0;bottom:0;border-right:1px solid #d5dcea}
.mb{position:absolute;top:0;height:62%;background:#2a2f3a;border-radius:0 0 2px 2px}
#win{position:absolute;top:0;bottom:0;border:2px solid var(--acc);background:rgba(47,107,255,.16);border-radius:5px;pointer-events:none}
.stage{flex:1;min-height:0;display:flex;flex-direction:row;gap:8px;margin:8px 10px 10px;padding:8px 8px 6px;background:linear-gradient(#cdd7e8,#b5c2d8);border-radius:10px;border-top:4px solid #d9485d}
.rail{flex:1;min-height:0;overflow:hidden;position:relative}
#keys{position:relative;height:100%}
#sc{display:none}
.wk,.bk{position:absolute;top:0;cursor:pointer;touch-action:none;transform-origin:50% 0;transition:transform .05s}
.wk{height:100%;background:linear-gradient(180deg,#fff 0,#fbfcfe 72%,#e4e9f2 100%);border-radius:0 0 9px 9px;box-shadow:inset 0 -12px 10px -8px rgba(40,60,100,.28),0 3px 0 #c6cfdd,0 7px 8px rgba(30,50,90,.22);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px}
.wk i{font:700 11px 'Manrope';color:#8a97ad;font-style:normal;pointer-events:none}
.wk i:not(.c){display:none}.lbl .wk i{display:block}
.bk{height:62%;z-index:2;background:linear-gradient(90deg,#222733,#3b4252 30%,#161a23 75%,#0b0d12);border-radius:0 0 7px 7px;box-shadow:0 7px 8px rgba(20,30,50,.5),inset 0 -10px 8px rgba(255,255,255,.08)}
.wk.a{transform:translateY(3px);background:linear-gradient(#d6e4ff,#9dbcff);box-shadow:0 1px 0 #9db0d6}
.bk.a{transform:translateY(3px);background:linear-gradient(#3a72ff,#1d44b3);box-shadow:0 2px 3px rgba(20,30,50,.5)}
.grid{display:grid;gap:7px}
.voices{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.mg{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid .btn{height:auto;min-height:42px;padding:10px 8px;background:#f1f4fa}
.grid .btn.on{background:var(--acc)}
.ov{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(20,30,50,.45)}.ov.on{display:flex}
.sheet{width:min(92vw,580px);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:12px;box-shadow:0 20px 50px rgba(20,30,50,.4)}
.note{font-size:11px;color:var(--dim);text-align:center;margin-top:10px}
.top,.stage,#mini{transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s}
.boot .top{opacity:0;transform:translateY(-100%)}.boot .stage,.boot #mini{opacity:0;transform:translateY(40px)}
#intro{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#fff,#dbe5f5 75%);transition:opacity .8s,visibility 0s .8s}
#intro.go{opacity:0;visibility:hidden}
#intro h1{margin:0;font:700 clamp(40px,10vw,76px) 'Cormorant Garamond',serif;color:#1b2536;opacity:0;animation:lg 1.3s .2s forwards}
@keyframes lg{from{opacity:0;letter-spacing:.8em;filter:blur(8px)}to{opacity:1;letter-spacing:.26em;filter:none}}
#intro .ln{height:2px;width:0;margin:10px 0 12px;background:linear-gradient(90deg,transparent,#2f6bff,transparent);animation:lw 1.1s .9s forwards}
@keyframes lw{to{width:min(60vw,380px)}}
#intro p{margin:0;font:700 12px 'Manrope';letter-spacing:.45em;color:#2f6bff;opacity:0;animation:fi 1s 1.2s forwards}
@keyframes fi{to{opacity:1}}
#intro svg{width:96px;height:96px;margin-bottom:14px;opacity:0;animation:fi .9s .1s forwards}
#intro .bar{width:min(50vw,240px);height:3px;margin-top:22px;background:#cfd8e8;border-radius:2px;overflow:hidden}
#intro .bar b{display:block;height:100%;width:0;background:#2f6bff;animation:ld 2.1s .4s forwards}
@keyframes ld{to{width:100%}}
@media(prefers-reduced-motion:reduce){#intro{display:none}.top,.stage,#mini{transition:none}.boot .top,.boot .stage,.boot #mini{opacity:1;transform:none}}
</style>
</head>
<body class="boot">
<div id="intro"><svg viewBox="0 0 130 130" aria-hidden="true"><rect width="130" height="130" rx="28" fill="#fff"/><path d="M34 98 V44 Q34 30 50 30 H66 Q100 32 98 62 Q96 80 98 98 Z" fill="#2f6bff"/><path d="M42 90 V46 Q42 38 52 38 H66" fill="none" stroke="#7fa3ff" stroke-width="3" stroke-linecap="round"/><rect x="38" y="98" width="56" height="12" rx="2" fill="#fff" stroke="#1b2536" stroke-width="1.5"/><path d="M48 98.5v7M56 98.5v7M70 98.5v7M78 98.5v7M86 98.5v7" stroke="#1b2536" stroke-width="4"/><rect x="56" y="48" width="6" height="30" fill="#fff"/><path d="M62 51 H70 A7 7 0 0 1 70 65 H62" fill="none" stroke="#fff" stroke-width="6"/><path d="M68 66 L76 78" stroke="#fff" stroke-width="6"/></svg><h1>ROSSUM</h1><div class="ln"></div><p>GRAND PIANO</p><div class="bar"><b></b></div></div>
<div class="app">
 <header class="top">
  <button class="btn snd" id="sndb"><span id="vn"></span> ▾</button>
  <span class="pill" id="st">READY</span>
  <div class="grp"><button class="btn" id="rec">● REC</button><button class="btn" id="play">▶</button><button class="btn" id="stop">■</button></div>
  <div class="grp"><button class="btn" id="met">♩</button><button class="btn" id="bm">−</button><b id="bpm">100</b><button class="btn" id="bp">+</button></div>
  <button class="btn" id="sus">SUSTAIN</button>
  <div class="grp"><button class="btn" id="od">‹</button><span id="l2"></span><button class="btn" id="ou">›</button></div>
  <span class="pill" id="ln">--</span>
  <input type="range" id="vol" min="0" max="1" step=".01" value=".75" aria-label="Volume">
  <button class="btn" id="mn">⚙</button>
 </header>
 <div id="minirow"><button class="btn" id="zo" aria-label="More keys">−</button><div id="mini"><div id="win"></div></div><button class="btn" id="zi" aria-label="Fewer keys">+</button></div>
 <div class="stage"><div class="pedal" id="pedal">SUSTAIN PEDAL</div><div class="rail" id="rail"><div id="keys"></div></div><input type="range" id="sc" min="0" max="100" value="0"></div>
</div>
<div class="ov" id="vs"><div class="sheet"><div class="grid voices" id="vb"></div></div></div>
<div class="ov" id="menu"><div class="sheet"><div class="grid mg">
<button class="btn" id="m_rv"></button><button class="btn" id="m_ly"></button><button class="btn" id="m_tc"></button><button class="btn" id="m_lb"></button><button class="btn" id="m_sz"></button>
<button class="btn" id="m_sv"><i></i>SAVE TAKE</button><button class="btn" id="m_ns"></button><button class="btn" id="m_ds"><i></i>DELETE SONG</button><button class="btn" id="m_ex"><i></i>EXPORT MIDI</button><button class="btn" id="m_x"><i></i>CLOSE</button>
</div><div class="note">Piano samples: Salamander Grand Piano by Alexander Holm (CC BY 3.0)</div></div></div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
let ac,master,nb,wetG,rv=1,lyr='',touch=0,vk=0;const WET=[0,.18,.4],RVN=['OFF','ROOM','HALL'];function mkIR(){const n=ac.sampleRate*2.2|0,b=ac.createBuffer(2,n,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}return b;}
function init(){
 if(!ac){
  ac=new(window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=+$('vol').value;
  const c=ac.createDynamicsCompressor();c.threshold.value=-10;c.knee.value=12;c.ratio.value=3;c.attack.value=.003;c.release.value=.2;const cv=ac.createConvolver();cv.buffer=mkIR();wetG=ac.createGain();wetG.gain.value=WET[rv];master.connect(c);master.connect(cv);cv.connect(wetG).connect(c);c.connect(ac.destination);
  nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
  const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;loadSamples();
 }
 if(ac.state!=='running')ac.resume();
}
const hz=m=>440*Math.pow(2,(m-69)/12);
const bufs={};let sload=0,sstart=0;
async function loadSamples(){
 if(sstart)return;sstart=1;
 const NS=['C','Cs','D','Ds','E','F','Fs','G','Gs','A','As','B'];
 for(let m=21;m<=108;m+=3){
  const f=NS[m%12]+(Math.floor(m/12)-1)+'.mp3';
  for(const u of ['samples/'+f,'https://tonejs.github.io/audio/salamander/'+f]){
   try{const r=await fetch(u);if(!r.ok)continue;bufs[m]=await ac.decodeAudioData(await r.arrayBuffer());break;}catch(e){}
  }
  sload++;$('ln').textContent=sload<30?'LOAD '+sload+'/30':'PIANO';
 }
}
function samp(m,vl){
 vl=vl||1;const m0=21+3*Math.round((m-21)/3),b=bufs[m0];if(!b)return null;
 const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
 s.buffer=b;s.playbackRate.value=Math.pow(2,(m-m0)/12);
 f.type='lowpass';f.frequency.value=2500+13500*vl;g.gain.value=.4+.6*vl;
 s.connect(f).connect(g).connect(master);s.start(t);
 return{stop(){const n=ac.currentTime,r=m<60?.5:.25;g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(g.gain.value,n);g.gain.linearRampToValueAtTime(0,n+r);s.stop(n+r+.05);}};
}
function build(f,o,vl){vl=vl||1;
 const t=ac.currentTime,out=ac.createGain();out.gain.value=0;out.connect(master);
 let dest=out;
 if(o.f){const b=ac.createBiquadFilter();b.type='lowpass';b.Q.value=o.f[3]||.5;b.frequency.setValueAtTime(o.f[0],t);b.frequency.exponentialRampToValueAtTime(o.f[1],t+o.f[2]);b.connect(out);dest=b;}
 const os=o.p.map(([m,a,ty,dt])=>{const x=ac.createOscillator(),g=ac.createGain();x.type=ty;x.frequency.value=f*m;if(dt)x.detune.value=dt;g.gain.value=a;x.connect(g).connect(dest);x.start(t);return x;});
 const g=out.gain;g.setValueAtTime(0,t);g.linearRampToValueAtTime(o.pk*vl,t+o.a);
 if(o.sus){g.exponentialRampToValueAtTime(o.sus*vl,t+o.a+o.d);}
 if(o.end){g.exponentialRampToValueAtTime(.0008,t+o.end);}
 return{stop(){const n=ac.currentTime;g.cancelScheduledValues(n);g.setValueAtTime(g.value,n);g.linearRampToValueAtTime(0,n+o.rel);os.forEach(x=>x.stop(n+o.rel+.03));}};
}
function noise(type,fq,dur,vol){
 const t=ac.currentTime,s=ac.createBufferSource(),b=ac.createBiquadFilter(),g=ac.createGain();
 s.buffer=nb;b.type=type;b.frequency.value=fq;
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 s.connect(b).connect(g).connect(master);s.start(t);s.stop(t+dur+.02);
}
function thump(f0,f1,dur,vol){
 const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
 o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 o.connect(g).connect(master);o.start(t);o.stop(t+dur+.02);
}
const DRUMS=['Kick','Snare','Hi-hat','Open hat','Tom','Crash'];
function drum(m){
 const k=m%6;
 if(k===0)thump(160,45,.3,1);
 else if(k===1){noise('bandpass',1800,.2,.8);thump(220,120,.12,.5);}
 else if(k===2)noise('highpass',7000,.05,.5);
 else if(k===3)noise('highpass',7000,.4,.45);
 else if(k===4)thump(220,80,.35,.9);
 else noise('highpass',3500,1,.45);
 return{stop(){}};
}
const V={
 piano:{n:'GRAND PIANO',sam:1,o:{p:[[1,.6,'triangle'],[2,.3,'sine'],[3,.14,'sine'],[4,.08,'sine']],a:.006,pk:.85,sus:.28,d:.35,end:8,f:[6200,1200,2.2,.4],rel:.35}},
 epiano:{n:'E.PIANO',o:{p:[[1,.6,'sine'],[2,.2,'sine'],[4,.08,'sine']],a:.01,pk:.7,sus:.22,d:.6,end:3.5,f:[5000,1500,1],rel:.25}},
 organ:{n:'PIPE ORGAN',o:{p:[[1,.5,'sine'],[2,.35,'sine'],[3,.18,'sine'],[4,.14,'sine'],[6,.08,'sine']],a:.03,pk:.5,rel:.12}},
 strings:{n:'STRINGS',o:{p:[[1,.4,'sawtooth',-8],[1,.4,'sawtooth',8],[2,.12,'sawtooth']],a:.35,pk:.4,f:[1800,2400,.5,.7],rel:.5}},
 guitar:{n:'GUITAR',o:{p:[[1,.5,'sawtooth'],[2,.2,'triangle']],a:.003,pk:.8,sus:.25,d:.2,end:2.5,f:[4200,500,.6,1],rel:.15}},
 synth:{n:'SYNTH LEAD',o:{p:[[1,.4,'sawtooth',-6],[1,.4,'sawtooth',6],[.5,.18,'square']],a:.05,pk:.5,sus:.25,d:1.4,f:[500,3000,.15,4],rel:.4}},
 bells:{n:'BELLS',o:{p:[[1,.5,'sine'],[2.01,.3,'sine'],[3.4,.18,'sine'],[5.2,.1,'sine']],a:.004,pk:.7,end:3,rel:.5}},
 bass:{n:'SYNTH BASS',o:{p:[[.5,.6,'sawtooth'],[.25,.4,'sine']],a:.01,pk:.8,sus:.5,d:.3,f:[900,200,.3,2],rel:.15}},
 drums:{n:'DRUM KIT',drum:1}
};
let voice='piano',oct=3,sustain=false,down=false;
const act=new Map();
let recording=false,playing=false,take=[],t0=0,timers=[];
const nm=m=>['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][m%12]+(Math.floor(m/12)-1);
function lcd(){
 $('vn').textContent=V[voice].n;
 $('l2').textContent='OCT '+oct;
 $('bpm').textContent=bpm;
 const s=$('st');
 s.textContent=recording?'● REC':playing?'▶ PLAY':'READY';
 s.className=recording?'rec':playing?'play':'';
}
function on(m,v,pb,vl){
 init();const ex=act.get(m);if(ex){if(ex.hd)return;ex.h.stop();act.delete(m);}
 if(act.size>=24){const k0=act.keys().next().value;act.get(k0).h.stop();act.delete(k0);paint(k0,0);}
 v=v||voice;
 const mk=id=>V[id].drum?drum(m):(V[id].sam&&samp(m,vl))||build(hz(m),V[id].o,vl);const h1=mk(v),h2=lyr&&lyr!==v?mk(lyr):null;const h={stop(){h1.stop();if(h2)h2.stop();}};
 act.set(m,{h,s:false,pb,hd:1});
 paint(m,1);
 $('ln').textContent=V[v].drum?DRUMS[m%6]:nm(m);
 if(recording&&!pb)take.push({t:performance.now()-t0,e:1,m,v,vl});
}
function off(m,pb){
 const n=act.get(m);if(!n)return;
 if(recording&&!pb)take.push({t:performance.now()-t0,e:0,m});
 n.hd=0;if(sustain&&!pb){n.s=true;paint(m,0);return;}
 n.h.stop();act.delete(m);paint(m,0);
}
function setSus(x){
 sustain=x;$('sus').classList.toggle('on',x);$('pedal').classList.toggle('on',x);
 if(!x)act.forEach((n,m)=>{if(n.s){n.h.stop();act.delete(m);}});
}
function stopPb(){
 timers.forEach(clearTimeout);timers=[];
 act.forEach((n,m)=>{if(n.pb){n.h.stop();act.delete(m);paint(m,0);}});
 playing=false;$('play').classList.remove('on');lcd();
}
$('rec').onclick=()=>{
 init();
 if(recording){recording=false;$('rec').classList.remove('on');lcd();return;}
 stopPb();take=[];t0=performance.now();recording=true;$('rec').classList.add('on');lcd();
};
$('play').onclick=()=>{
 init();
 if(playing){stopPb();return;}
 if(recording){recording=false;$('rec').classList.remove('on');}
 if(!take.length){$('st').textContent='NO TAKE';return;}
 const s=take[0].t;playing=true;$('play').classList.add('on');lcd();
 take.forEach(x=>timers.push(setTimeout(()=>x.e?on(x.m,x.v,1,x.vl):off(x.m,1),x.t-s)));
 timers.push(setTimeout(stopPb,take[take.length-1].t-s+400));
};
$('stop').onclick=()=>{
 recording=false;$('rec').classList.remove('on');stopPb();
 act.forEach((n,m)=>{n.h.stop();paint(m,0);});act.clear();
};
let bpm=100,met=null,beat=0;
function tick(){
 const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
 o.type='square';o.frequency.value=beat%4?900:1500;
 g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
 o.connect(g).connect(master);o.start(t);o.stop(t+.06);beat++;
}
function startMet(){clearInterval(met);beat=0;tick();met=setInterval(tick,60000/bpm);}
$('met').onclick=()=>{
 init();
 if(met){clearInterval(met);met=null;$('met').classList.remove('on');}
 else{startMet();$('met').classList.add('on');}
};
function setBpm(d){bpm=Math.max(40,Math.min(240,bpm+d));lcd();if(met)startMet();}
$('bm').onclick=()=>setBpm(-5);$('bp').onclick=()=>setBpm(5);
let latch=0;$('sus').onpointerdown=ev=>{ev.preventDefault();latch=latch?0:1;setSus(latch);};
let W=46,BW=28;const calcW=()=>{const n=vk||(innerWidth>innerHeight?12:7);W=Math.max(36,Math.min(160,Math.round(($('rail').clientWidth||innerWidth)/n)));BW=Math.round(W*.62);};calcW();
const WI={0:0,2:1,4:2,5:3,7:4,9:5,11:6},BC={1:.94,3:2.06,6:3.9,8:5,10:6.1};
const kel={},keys=$('keys');
keys.style.width=36*W+'px';
const lay=()=>{keys.style.width=36*W+'px';for(const m in kel){const e=kel[m],o=Math.floor((m-36)/12),n=m%12;if(n in WI){e.style.left=(o*7+WI[n])*W+'px';e.style.width=W-1+'px';}else{e.style.left=(o*7+BC[n])*W-BW/2+'px';e.style.width=BW+'px';}}fit();};
for(let m=36;m<=96;m++){
 const o=Math.floor((m-36)/12),n=m%12,e=document.createElement('div');
 if(n in WI){
  e.className='wk';e.style.left=(o*7+WI[n])*W+'px';e.style.width=W-1+'px';
  e.innerHTML='<i'+(n===0?' class="c"':'')+'>'+nm(m)+'</i>';
 }else{
  e.className='bk';e.style.left=(o*7+BC[n])*W-BW/2+'px';e.style.width=BW+'px';
 }
 e.onpointerdown=ev=>{ev.preventDefault();if(e.releasePointerCapture)try{e.releasePointerCapture(ev.pointerId)}catch(x){}const r=e.getBoundingClientRect(),vl=touch?Math.max(.3,Math.min(1,(ev.clientY-r.top)/r.height*1.15)):1;down=true;on(m,0,0,vl);};
 e.onpointerenter=()=>{if(down)on(m);};
 e.onpointerup=e.onpointerleave=e.onpointercancel=()=>off(m);
 keys.appendChild(e);kel[m]=e;
}
function paint(m,x){if(kel[m])kel[m].classList.toggle('a',!!x);}
addEventListener('pointerup',()=>{down=false;});
const rail=$('rail'),sc=$('sc');
function fit(){sc.max=Math.max(0,keys.scrollWidth-rail.clientWidth);uw();}
function go(m){fit();rail.scrollLeft=Math.max(0,kel[m].offsetLeft-20);sc.value=rail.scrollLeft;}
sc.oninput=()=>{rail.scrollLeft=+sc.value;};
addEventListener('resize',()=>{calcW();lay();});
function setOct(d){oct=Math.max(2,Math.min(6,oct+d));lcd();go(12*(oct+1));}
$('od').onclick=()=>setOct(-1);$('ou').onclick=()=>setOct(1);
const KM={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15,';':16};
const held=new Set();
addEventListener('keydown',e=>{
 if(e.repeat||e.ctrlKey||e.metaKey)return;
 const k=e.key.toLowerCase();
 if(k===' '){e.preventDefault();setSus(true);}
 else if(k==='z')setOct(-1);else if(k==='x')setOct(1);
 else if(k in KM&&!held.has(k)){held.add(k);on(12*(oct+1)+KM[k]);}
});
addEventListener('keyup',e=>{
 const k=e.key.toLowerCase();
 if(k===' ')setSus(!!latch);
 else if(k in KM){held.delete(k);off(12*(oct+1)+KM[k]);}
});
const vb=$('vb');
Object.keys(V).forEach(id=>{
 const b=document.createElement('button');
 b.className='btn'+(id===voice?' on':'');b.innerHTML='<i></i>'+V[id].n;
 b.onclick=()=>{voice=id;[...vb.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');lcd();};
 vb.appendChild(b);
});
$('vol').oninput=e=>{if(master)master.gain.value=+e.target.value;};
lcd();
setTimeout(()=>go(48),50);
const VKO=[5,7,9,12,15,21];
function zoom(d,wrap){const cur=vk||(innerWidth>innerHeight?12:7);let i=VKO.reduce((b,v,j)=>Math.abs(v-cur)<Math.abs(VKO[b]-cur)?j:b,0)+d;i=wrap?(i+VKO.length)%VKO.length:Math.max(0,Math.min(VKO.length-1,i));vk=VKO[i];const c=(rail.scrollLeft+rail.clientWidth/2)/(keys.scrollWidth||1);calcW();lay();rail.scrollLeft=c*keys.scrollWidth-rail.clientWidth/2;}
$('zi').onclick=()=>zoom(-1);$('zo').onclick=()=>zoom(1);
const pd=$('pedal');pd.onpointerdown=ev=>{ev.preventDefault();setSus(true);};pd.onpointerup=pd.onpointercancel=pd.onpointerleave=()=>setSus(!!latch);
if(matchMedia('(display-mode: standalone)').matches)addEventListener('pointerdown',()=>{const e=document.documentElement;if(!document.fullscreenElement&&e.requestFullscreen)e.requestFullscreen({navigationUI:'hide'}).catch(()=>{});},{once:true});
const mini=$('mini'),win=$('win');
for(let m=36;m<=96;m++){const o=Math.floor((m-36)/12),n=m%12,e=document.createElement('div');
 if(n in WI){e.className='mw';e.style.left=(o*7+WI[n])/36*100+'%';e.style.width=100/36+'%';}
 else{e.className='mb';e.style.left=(o*7+BC[n]-.3)/36*100+'%';e.style.width=.6/36*100+'%';}
 mini.appendChild(e);}
function uw(){const w=keys.scrollWidth||1;win.style.width=Math.min(100,rail.clientWidth/w*100)+'%';win.style.left=rail.scrollLeft/w*100+'%';}
rail.addEventListener('scroll',uw);
const mv=ev=>{const r=mini.getBoundingClientRect();rail.scrollLeft=(ev.clientX-r.left)/r.width*keys.scrollWidth-rail.clientWidth/2;};
let md=0;mini.onpointerdown=ev=>{md=1;mini.setPointerCapture(ev.pointerId);mv(ev);};mini.onpointermove=ev=>{if(md)mv(ev);};mini.onpointerup=mini.onpointercancel=()=>{md=0;};
uw();
$('sndb').onclick=()=>$('vs').classList.add('on');
$('vs').onclick=ev=>{if(ev.target.id==='vs'||ev.target.closest('#vb'))$('vs').classList.remove('on');};
$('menu').onclick=ev=>{if(ev.target.id==='menu')$('menu').classList.remove('on');};
const SZ=[.8,1,1.25];let songs=[],si=0;try{songs=JSON.parse(localStorage.getItem('psr_songs')||'[]')}catch(e){}
const keep=()=>{try{localStorage.setItem('psr_songs',JSON.stringify(songs))}catch(e){}};
const mt=()=>{const b=document.body.classList.contains('lbl');
$('m_rv').innerHTML='<i></i>REVERB: '+RVN[rv];$('m_ly').innerHTML='<i></i>LAYER: '+(lyr?V[lyr].n:'OFF');$('m_tc').innerHTML='<i></i>TOUCH: '+(touch?'ON':'OFF');$('m_lb').innerHTML='<i></i>LABELS: '+(b?'ON':'OFF');$('m_sz').innerHTML='<i></i>KEYS ON SCREEN: '+(vk||(innerWidth>innerHeight?12:7));$('m_ns').innerHTML='<i></i>SONG: '+(songs.length?(si+1)+'/'+songs.length:'NONE');
$('m_rv').classList.toggle('on',rv>0);$('m_ly').classList.toggle('on',!!lyr);$('m_tc').classList.toggle('on',!!touch);$('m_lb').classList.toggle('on',b);};
$('mn').onclick=()=>{mt();$('menu').classList.add('on');};
$('m_x').onclick=()=>$('menu').classList.remove('on');
$('m_rv').onclick=()=>{rv=(rv+1)%3;if(wetG)wetG.gain.value=WET[rv];mt();};
$('m_ly').onclick=()=>{const o=['',...Object.keys(V).filter(k=>k!=='drums')];lyr=o[(o.indexOf(lyr)+1)%o.length];mt();};
$('m_tc').onclick=()=>{touch=touch?0:1;mt();};
$('m_lb').onclick=()=>{document.body.classList.toggle('lbl');mt();};
$('m_sz').onclick=()=>{zoom(1,1);mt();};
$('m_sv').onclick=()=>{if(!take.length){$('ln').textContent='NO TAKE';return;}songs.push({name:'TAKE '+(songs.length+1),take});si=songs.length-1;keep();$('ln').textContent='SAVED';mt();};
$('m_ns').onclick=()=>{if(!songs.length)return;si=(si+1)%songs.length;take=songs[si].take;$('ln').textContent=songs[si].name;mt();};
$('m_ds').onclick=()=>{if(!songs.length)return;songs.splice(si,1);si=0;keep();mt();};
const vlq=n=>{const b=[n&127];while(n>>=7)b.unshift((n&127)|128);return b;};
$('m_ex').onclick=async()=>{
 if(!take.length){$('ln').textContent='NO TAKE';return;}
 const ppq=480,s=take[0].t,tp=Math.round(60000000/bpm),tr=[0,255,81,3,tp>>16&255,tp>>8&255,tp&255];let last=0;
 take.forEach(x=>{const k=Math.round((x.t-s)*ppq*bpm/60000);tr.push(...vlq(k-last),x.e?144:128,x.m&127,x.e?Math.min(127,Math.round(40+87*(x.vl||1))):0);last=k;});
 tr.push(0,255,47,0);const L=tr.length;
 const f=new File([new Uint8Array([77,84,104,100,0,0,0,6,0,0,0,1,ppq>>8,ppq&255,77,84,114,107,L>>24&255,L>>16&255,L>>8&255,L&255,...tr])],'psr-take.mid',{type:'audio/midi'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download='psr-take.mid';a.click();
};
if(navigator.requestMIDIAccess)navigator.requestMIDIAccess().then(a=>{const hk=i=>{i.onmidimessage=e=>{const[s,n,v]=e.data,c=s&240;if(c===144&&v>0)on(n,0,0,v/127);else if(c===128||c===144)off(n);else if(c===176&&n===64)setSus(v>=64);};};a.inputs.forEach(hk);a.onstatechange=()=>a.inputs.forEach(hk);}).catch(()=>{});
function sweep(){const ms=Object.keys(kel).map(Number).sort((a,b)=>a-b);ms.forEach((m,i)=>{setTimeout(()=>{if(!act.has(m))paint(m,1)},i*16);setTimeout(()=>{if(!act.has(m))paint(m,0)},i*16+170);});}
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
setTimeout(()=>{$('intro').classList.add('go');document.body.classList.remove('boot');setTimeout(sweep,450);},rm?0:2700);
addEventListener('visibilitychange',()=>{if(ac&&document.visibilityState==='visible')ac.resume();});
})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
